[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-connectome-forecast"
version = "0.1.0"
description = "The FlyWire fruit-fly connectome as an echo state network reservoir for forecasting Polish wind and PV generation, against random and rewired reservoirs and standard baselines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pse-opendata>=0.2,<0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fly-forecast = "fly_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
